<style>
  :root{
    --paper: #EDE6D6;
    --panel: #F6F1E4;
    --ink: #211C16;
    --ink-soft: #6B5D49;
    --seal: #9C3322;
    --seal-dark: #7C2819;
    --jade: #4C6B54;
    --jade-soft: #6C8873;
    --line: #C9BCA0;
    --line-soft: #DCD2BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(156,51,34,0.05), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(76,107,84,0.05), transparent 45%);
    color: var(--ink);
    font-family: 'Noto Serif', Georgia, serif;
    height: 100vh;
    height: 100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: clamp(16px, 2.5vh, 40px) clamp(12px, 3vw, 40px) clamp(20px, 4vh, 60px);
    overflow: hidden;
  }
  header{ max-width: min(1800px, 96vw); width:100%; text-align:center; margin-bottom: clamp(14px, 2vh, 28px); }
  .eyebrow{
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color: var(--seal); font-weight:600; margin-bottom:8px;
  }
  h1{ font-family:'Noto Serif TC', serif; font-weight:700; font-size: clamp(26px, 2.6vw, 46px); margin: 0 0 6px; letter-spacing: .01em; }
  h1 .cjk{ color: var(--seal); }
  .sub{ font-size:14px; color: var(--ink-soft); font-style:italic; }

  .app{
    max-width: min(1800px, 96vw); width:100%; background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 8px 24px rgba(33,28,22,0.08);
    overflow:visible;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line-soft); font-family:'Inter',sans-serif;
  }
  .mode-label{ font-size:13px; color: var(--ink-soft); }
  .mode-label b{ color: var(--ink); font-weight:600; }
  .upload-btn{
    font-family:'Inter',sans-serif; font-size:12px; color: var(--jade); background: transparent;
    border: 1px solid var(--jade-soft); border-radius: 3px; padding: 5px 11px; cursor:pointer;
    transition: all .15s ease;
  }
  .upload-btn:hover{ background: var(--jade); color:#fff; }

  .font-btns{ display:inline-flex; gap:4px; }
  .font-btn{
    font-family:'Inter',sans-serif; font-size:10px; font-weight:600; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--line); border-radius: 3px;
    width:22px; height:22px; line-height:1; cursor:pointer; transition: all .15s ease;
    display:inline-flex; align-items:center; justify-content:center; padding:0;
  }
  .font-btn:hover{ background: var(--ink-soft); color:#fff; border-color: var(--ink-soft); }

  .panels{ display:grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; flex:1; min-height:0; }
  .panel{ padding: clamp(14px, 1.6vw, 28px); flex:1; display:flex; flex-direction:column; position:relative; min-height:0; }
  .panel-label{
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color: var(--ink-soft); margin-bottom: 10px; font-weight:600;
  }
  .panel textarea{
    flex:1; resize:none; border:none; background:transparent;
    font-family: 'Noto Serif TC', 'Noto Serif', serif; font-size: clamp(18px, 1.3vw, 28px); line-height:1.9;
    color: var(--ink); outline:none; overflow-y:auto;
  }
  .panel textarea::placeholder{ color:#B8AA8F; font-style:italic; font-size:16px;}

  .ta-wrap{ position:relative; flex:1; min-height:0; }
  .ta-wrap textarea{
    position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; flex:none;
  }
  .ta-highlight{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; margin:0; padding:0;
    font-family:'Noto Serif TC','Noto Serif',serif; font-size: clamp(18px, 1.3vw, 28px); line-height:1.9;
    white-space:pre-wrap; word-wrap:break-word; word-break:break-word; color:transparent;
  }
  .ta-highlight mark{ background: rgba(156,51,34,0.28); color:transparent; border-radius:2px; }

  .output-render{
    flex:1; font-family: 'Noto Serif TC','Noto Serif', serif; font-size: clamp(17px, 1.25vw, 27px); line-height: 2.1;
    word-break: break-word; overflow-y:auto;
  }
  .unit{ position:relative; display:inline; cursor:pointer; border-radius:2px; padding: 1px 1px; }
  .unit:hover{ background: rgba(156,51,34,0.08); }
  .unit.ambiguous{ color: var(--seal); font-weight:600; }
  .unit.missing{ border-bottom: 2px dashed #B8AA8F; color:#9A8B70; cursor:default; }
  .unit.missing:hover{ background:transparent; }
  .unit.cross-highlight{ background: rgba(156,51,34,0.28); border-radius:2px; }

  .divider{ display:flex; align-items:center; justify-content:center; padding: 0 4px; }
  .swap-btn{
    width: 46px; height:46px; border-radius:50%; background: var(--seal); color:#F6F1E4;
    border: 2px solid var(--seal-dark); font-family:'Noto Serif TC', serif; font-size: 18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(124,40,25,0.35); transition: transform .18s ease;
  }
  .swap-btn:hover{ transform: rotate(180deg); }
  .swap-btn:active{ transform: rotate(180deg) scale(.92); }

  .footer-note{
    font-family:'Inter',sans-serif; font-size:12px; color: var(--ink-soft);
    padding: 12px 20px 18px; border-top: 1px solid var(--line-soft); line-height:1.6;
  }
  .footer-note b{ color: var(--seal); }

  /* Floating panels: info popup / picker / scope */
  .float-panel{
    position:fixed; z-index:40;
    background: var(--ink); color: var(--panel); border-radius: 8px; padding: 12px 14px;
    font-family:'Inter',sans-serif; font-size:13px; box-shadow: 0 8px 22px rgba(0,0,0,0.28);
    min-width: 190px; text-align:left;
  }
  .float-panel::before{
    content:""; position:absolute; top:-6px; left: var(--arrow-x, 50%); transform: translateX(-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 6px solid var(--ink);
  }
  .float-panel.flip-up::before{
    top:auto; bottom:-6px; border-bottom:none; border-top: 6px solid var(--ink);
  }

  .info-panel .han-big{
    font-family:'Noto Serif TC', serif; font-size: 30px; color:#fff; line-height:1;
    display:block; margin-bottom: 6px;
  }
  .info-panel .reading{ color:#E8B4A0; font-style:italic; font-size:14px; margin-bottom:4px; }
  .info-panel .meaning{ color:#C9BCA0; font-size:12px; line-height:1.5; }

  .picker-panel .cand{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color: var(--panel); font-family:'Noto Serif', serif; font-size:14px; padding: 6px 8px;
    border-radius:4px; cursor:pointer;
  }
  .picker-panel .cand .han{ font-family:'Noto Serif TC',serif; font-size:18px; margin-right:8px; }
  .picker-panel .cand:hover{ background: rgba(255,255,255,0.12); }
  .picker-panel hr{ border:none; border-top:1px solid rgba(255,255,255,0.15); margin:8px 0; }
  .picker-panel .custom-row{ display:flex; gap:6px; }
  .picker-panel input[type=text]{
    flex:1; background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25);
    color:#fff; border-radius:4px; padding: 5px 7px; font-family:'Noto Serif',serif; font-size:13px;
  }
  .picker-panel input[type=text]::placeholder{ color: rgba(255,255,255,0.45); }
  .picker-panel button.go{
    background: var(--seal); border:none; color:#fff; border-radius:4px; padding: 5px 10px;
    cursor:pointer; font-family:'Inter',sans-serif; font-size:12px;
  }
  .picker-panel button.go:hover{ background: var(--seal-dark); }

  .scope-panel{ background: var(--seal); }
  .scope-panel::before{ border-bottom-color: var(--seal); }
  .scope-panel.flip-up::before{ border-top-color: var(--seal); border-bottom:none; }
  .scope-panel .title{ font-size:12px; margin-bottom:8px; color: rgba(255,255,255,0.85); }
  .scope-panel button{
    display:block; width:100%; margin-top:6px; background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3); color:#fff; padding: 6px 10px; border-radius:4px;
    cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; text-align:left;
  }
  .scope-panel button:hover{ background: rgba(255,255,255,0.28); }

  @media (max-width: 720px){
    .panels{ grid-template-columns: 1fr; }
    .panel{ height: 38vh; }
    .divider{ padding: 10px 0; }
    .swap-btn{ transform: rotate(90deg); }
    .swap-btn:hover{ transform: rotate(270deg); }
  }
</style>
</head>
<body>

<header>
  <h1><span class="cjk">漢越</span> Chuyển đổi Hán văn ⇄ Phiên âm</h1>
</header>

<div class="app">
  <div class="toolbar">
    <div style="display:flex; gap:8px; margin-left:auto;">
      <label class="upload-btn">
        Tải file .txt
        <input type="file" id="fileInput" accept=".txt" style="display:none">
      </label>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-label" style="display:flex; justify-content:space-between; align-items:center;">

// ---------- persistence (localStorage) ----------
const LS_KEY = 'hanviet_tool_v1';
const FONT_LS_KEY = 'hanviet_font_prefs_v1';
function loadStore(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}
function saveStore(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      charOverrides, ctxOverrides, customEntries,
      lastText: inputArea ? inputArea.value : '', lastMode: mode
    }));
  } catch(e){ /* storage unavailable, fail silently */ }
  syncToCloud();
}

// ---------- optional cloud sync (Firebase Realtime Database) ----------
// personal dictionary data only (charOverrides/ctxOverrides/customEntries) — not the current draft text
const FIREBASE_URL = 'https://pahanviet-default-rtdb.asia-southeast1.firebasedatabase.app';
const FIREBASE_PATH = '/hanvietData.json';

function syncToCloud(){
  fetch(FIREBASE_URL + FIREBASE_PATH, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ charOverrides, ctxOverrides, customEntries })
  }).catch(() => { /* offline or unreachable — local copy is still safe */ });
}

async function pullFromCloud(){
  try {
    const res = await fetch(FIREBASE_URL + FIREBASE_PATH);
    if (!res.ok) return;
    const cloud = await res.json();
    if (!cloud) return;
    if (cloud.charOverrides) charOverrides = cloud.charOverrides;
    if (cloud.ctxOverrides) ctxOverrides = cloud.ctxOverrides;
    if (cloud.customEntries) customEntries = cloud.customEntries;
    mergeCustomEntries();

  } catch(e){ /* offline or unreachable — app still works from local data */ }
}

const stored = loadStore();

let mode = (stored && stored.lastMode) || 'han2phien';
// three override tiers, checked idx > context > char. idx is session-only (tied to exact text), ctx/char persist.
let idxOverrides = {};
let ctxOverrides = (stored && stored.ctxOverrides) || {};
let charOverrides = (stored && stored.charOverrides) || {};
// customEntries: extra readings/chars the user has permanently taught the dictionary
let customEntries = (stored && stored.customEntries) || { readings: {}, chars: {} };
let currentParsed = []; // parsed sequence for current render, for context lookups

// merge any previously-saved custom entries into the live dictionary
// Firebase Realtime Database silently drops empty objects/arrays when saving,
// so a round-tripped customEntries can be missing "readings" or "chars" entirely — always normalize.
function normalizeCustomEntries(ce){
  return { readings: (ce && ce.readings) || {}, chars: (ce && ce.chars) || {} };
}

function mergeCustomEntries(){
  customEntries = normalizeCustomEntries(customEntries);
  Object.entries(customEntries.readings).forEach(([ch, extraReadings]) => {
    const rec = charMap[ch];
    if (!rec) return;
    (extraReadings || []).forEach(r => {
      if (!rec.readings.includes(r)) rec.readings.push(r);
      const key = r.toLowerCase();
      if (!readingMap[key]) readingMap[key] = [];
      if (!readingMap[key].includes(ch)) readingMap[key].push(ch);
    });
  });
  Object.entries(customEntries.chars).forEach(([reading, extraChars]) => {
    const key = reading.toLowerCase();
    if (!readingMap[key]) readingMap[key] = [];
    (extraChars || []).forEach(ch => {
      if (!readingMap[key].includes(ch)) readingMap[key].push(ch);
      if (!charMap[ch]) charMap[ch] = { char: ch, readings: [reading], nghia: '(tự thêm)', goiy: '' };
    });
  });
}
mergeCustomEntries();

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// always-visible highlight overlay, independent of whether the textarea has focus
function setInputHighlight(start, end){
  const text = inputArea.value;
  const before = escapeHtml(text.slice(0, start));
  const marked = escapeHtml(text.slice(start, end)) || '&nbsp;';
  const after = escapeHtml(text.slice(end));
  taHighlight.innerHTML = before + '<mark>' + marked + '</mark>' + after;
}

function refreshInputHighlight(){
  taHighlight.textContent = inputArea.value;
}

inputArea.addEventListener('scroll', () => { taHighlight.scrollTop = inputArea.scrollTop; });

// --- cross-reference highlighting: hovering an output unit highlights its source text in the input ---
function codePointOffset(text, cpIndex){
  const arr = [...text];
  let offset = 0;
  for (let k = 0; k < cpIndex && k < arr.length; k++) offset += arr[k].length;
  return offset;
}

function highlightHanChar(idx){
  const text = inputArea.value;
  const start = codePointOffset(text, idx);
  const chars = [...text];
  const end = start + (chars[idx] ? chars[idx].length : 1);
  inputArea.setSelectionRange(start, end);
  setInputHighlight(start, end);
  scrollTextareaToOffset(start);
}

function getSyllOffset(text, syllIdx){
  const tokens = text.split(/(\s+)/);
  let offset = 0, count = 0;
  for (const tok of tokens){
    if (/^\s+$/.test(tok) || tok === ''){ offset += tok.length; continue; }
    if (count === syllIdx) return { start: offset, end: offset + tok.length };
    offset += tok.length;
    count++;
  }
  return null;
}

function highlightSyll(idx){
  const range = getSyllOffset(inputArea.value, idx);
  if (range){
    inputArea.setSelectionRange(range.start, range.end);
    setInputHighlight(range.start, range.end);
    scrollTextareaToOffset(range.start);
  }
}

function clearInputHighlight(){
  const pos = inputArea.selectionStart;
  inputArea.setSelectionRange(pos, pos);
  refreshInputHighlight();
}

// measure where a character offset would fall inside the (possibly word-wrapped) textarea,
// using an invisible mirror div with identical text-flow styling, then scroll it into view
const MIRROR_PROPS = ['boxSizing','width','paddingTop','paddingRight','paddingBottom','paddingLeft',
  'borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth',
  'fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight',
  'textTransform','textIndent','textAlign','wordBreak'];

function scrollTextareaToOffset(offset){
  const style = getComputedStyle(inputArea);
  const div = document.createElement('div');
  MIRROR_PROPS.forEach(p => div.style[p] = style[p]);
  div.style.position = 'absolute';
  div.style.visibility = 'hidden';
  div.style.whiteSpace = 'pre-wrap';
  div.style.wordWrap = 'break-word';
  div.style.height = 'auto';
  div.style.top = '0';
  div.style.left = '-9999px';
  document.body.appendChild(div);
  div.textContent = inputArea.value.substring(0, offset);
  const marker = document.createElement('span');
  marker.textContent = inputArea.value.substring(offset) || '.';
  div.appendChild(marker);
  const top = marker.offsetTop;
  document.body.removeChild(div);

  const lineHeight = parseFloat(style.lineHeight) || 24;
  const target = top - inputArea.clientHeight / 2 + lineHeight / 2;
  inputArea.scrollTop = Math.max(0, target);
}

// ---------- reverse direction: hovering the input text highlights the matching output unit ----------
let charBoxes = [];
let lastHoverIdx = -1;

function buildCharBoxes(){
  charBoxes = [];
  const text = inputArea.value;
  if (!text) return;
  const style = getComputedStyle(inputArea);
  const mirror = document.createElement('div');
  MIRROR_PROPS.forEach(p => mirror.style[p] = style[p]);
  mirror.style.position = 'absolute';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  mirror.style.wordBreak = 'break-word';
  mirror.style.height = 'auto';
  mirror.style.top = '0';
  mirror.style.left = '-9999px';
  document.body.appendChild(mirror);

  const chars = [...text];
  chars.forEach(ch => {
    const span = document.createElement('span');
    span.textContent = ch;
    mirror.appendChild(span);
  });
  const mirrorRect = mirror.getBoundingClientRect();
  Array.from(mirror.children).forEach(span => {
    const r = span.getBoundingClientRect();
    charBoxes.push({
      left: r.left - mirrorRect.left, top: r.top - mirrorRect.top,
      right: r.right - mirrorRect.left, bottom: r.bottom - mirrorRect.top
    });
  });
  document.body.removeChild(mirror);
  lastHoverIdx = -1;
}

function findCharIndexAtPoint(x, y){
  for (let i = 0; i < charBoxes.length; i++){
    const b = charBoxes[i];
    if (x >= b.left && x < b.right && y >= b.top && y < b.bottom) return i;
  }
  return -1;
}

function highlightOutputUnit(idx){
  clearOutputHighlight();
  const el = outputRender.querySelector('.unit[data-idx="' + idx + '"]');
  if (!el) return;
  el.classList.add('cross-highlight');
  el.scrollIntoView({ block: 'center', inline: 'nearest' });
}

function clearOutputHighlight(){
  const prev = outputRender.querySelector('.cross-highlight');
  if (prev) prev.classList.remove('cross-highlight');
}

inputArea.addEventListener('mousemove', (e) => {
  const rect = inputArea.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top + inputArea.scrollTop;
  const idx = findCharIndexAtPoint(x, y);
  if (idx === lastHoverIdx) return;
  lastHoverIdx = idx;
  if (idx >= 0) highlightOutputUnit(idx);
  else clearOutputHighlight();
});

inputArea.addEventListener('mouseleave', () => { lastHoverIdx = -1; clearOutputHighlight(); });

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(buildCharBoxes, 200);
});

function closeFloating(){ document.querySelectorAll('.float-panel').forEach(el => el.remove()); }

function attachFloat(anchor, panel){
  document.body.appendChild(panel);
  const rect = anchor.getBoundingClientRect();
  const margin = 8;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const pw = panel.offsetWidth;
  const ph = panel.offsetHeight;

  // vertical: prefer below anchor, flip above if it would run off the bottom edge
  const spaceBelow = vh - rect.bottom;
  let top, flipped = false;
  if (spaceBelow < ph + margin && rect.top > ph + margin){
    top = rect.top - ph - margin;
    flipped = true;
  } else {
    top = rect.bottom + margin;
  }
  top = Math.max(margin, Math.min(top, vh - ph - margin));

  // horizontal: center on anchor, clamp so it never runs off the left/right edge
  const anchorCenterX = rect.left + rect.width / 2;
  let left = anchorCenterX - pw / 2;
  left = Math.max(margin, Math.min(left, vw - pw - margin));

  panel.style.position = 'fixed';
  panel.style.top = top + 'px';
  panel.style.left = left + 'px';
  panel.style.transform = 'none';

  // keep the little arrow pointing at the anchor even when the panel itself was shifted
  const arrowX = Math.max(14, Math.min(anchorCenterX - left, pw - 14));
  panel.style.setProperty('--arrow-x', arrowX + 'px');
  panel.classList.toggle('flip-up', flipped);

  panel.addEventListener('mousedown', e => e.stopPropagation());
  panel.addEventListener('click', e => e.stopPropagation());
}

function resetOverrides(){ idxOverrides = {}; } // ctx/char overrides are taught corrections — kept across edits & reloads

// ---------- HAN -> PHIEN AM ----------
function parseHan2Phien(text){
  const seq = [];
  [...text].forEach((ch, i) => {
    if (isHanChar(ch)) seq.push({ type:'han', ch, i });
    else seq.push({ type:'text', ch, i });
  });
  return seq;
}

function neighborChar(seq, pos, dir){
  let j = pos + dir;
  while (j >= 0 && j < seq.length){
    if (seq[j].type === 'han') return seq[j].ch;
    if (seq[j].ch === '\n') return null;
    j += dir;
  }
  return null;
}

function readingFor(idx, ch, seq, rec){
  if (idxOverrides[idx] !== undefined) return idxOverrides[idx];
  const left = neighborChar(seq, idx, -1);
  const right = neighborChar(seq, idx, 1);
  const ctxKeyL = ch + '|L:' + left;
  const ctxKeyR = ch + '|R:' + right;
  if (left && ctxOverrides[ctxKeyL] !== undefined) return ctxOverrides[ctxKeyL];
  if (right && ctxOverrides[ctxKeyR] !== undefined) return ctxOverrides[ctxKeyR];
  if (charOverrides[ch] !== undefined) return charOverrides[ch];
  return rec ? rec.readings[0] : null;
}

function capitalizeFirst(s){
  if (!s) return s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

const PUNCT_MAP = { '。': '.', '，': ',' };

function renderHan2Phien(text){
  outputRender.innerHTML = '';
  const seq = parseHan2Phien(text);
  currentParsed = seq;
  let needSpace = false;
  seq.forEach((tok, idx) => {
    if (tok.type === 'text'){
      if (tok.ch === '\n'){ outputRender.appendChild(document.createElement('br')); needSpace = false; return; }
      // punctuation attaches directly to the previous word, no space before it
      outputRender.appendChild(document.createTextNode(PUNCT_MAP[tok.ch] || tok.ch));
      needSpace = true; // but the next word still needs a space before it
      return;
    }
    if (needSpace) outputRender.appendChild(document.createTextNode(' '));
    const rec = charMap[tok.ch];
    const span = document.createElement('span');
    if (!rec){
      span.className = 'unit missing';
      span.textContent = tok.ch;
      span.title = 'Chuột phải (hoặc chạm) để thêm âm cho chữ này';
      span.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); showAddReadingHan(span, tok.ch); });
      span.addEventListener('click', (e) => { e.stopPropagation(); showAddReadingHan(span, tok.ch); });
      span.addEventListener('mouseenter', () => highlightHanChar(idx));
      span.addEventListener('mouseleave', () => clearInputHighlight());
    } else {
      const reading = readingFor(idx, tok.ch, seq, rec);
      span.className = 'unit' + (rec.readings.length > 1 ? ' ambiguous' : '');
      span.textContent = capitalizeFirst(reading);
      span.dataset.idx = idx;
      span.addEventListener('mouseenter', () => { showInfo(span, tok.ch, reading, rec); highlightHanChar(idx); });
      span.addEventListener('mouseleave', () => { scheduleClose(); clearInputHighlight(); });
      span.addEventListener('click', (e) => { e.stopPropagation(); showPickerHan(span, idx, tok.ch, rec); });
    }
    outputRender.appendChild(span);
    needSpace = true;
  });
}

let infoCloseTimer = null;

function showInfo(anchor, han, reading, rec){

function scheduleClose(){

function applyHan2PhienReading(scope, idx, ch, reading){
  const seq = currentParsed;
  if (scope === 'single'){
    idxOverrides[idx] = reading;
  } else if (scope === 'context'){
    const left = neighborChar(seq, idx, -1);
    const right = neighborChar(seq, idx, 1);
    if (left) ctxOverrides[ch + '|L:' + left] = reading;
    if (right) ctxOverrides[ch + '|R:' + right] = reading;
    if (!left && !right) charOverrides[ch] = reading; // no context, fall back
  } else {
    charOverrides[ch] = reading;
    // teach the dictionary this reading permanently so it appears as a real candidate next time
    const rec = charMap[ch];
    if (rec && !rec.readings.includes(reading)){
      rec.readings.push(reading);
      const key = reading.toLowerCase();
      if (!readingMap[key]) readingMap[key] = [];
      if (!readingMap[key].includes(ch)) readingMap[key].push(ch);
      if (!customEntries.readings[ch]) customEntries.readings[ch] = [];
      if (!customEntries.readings[ch].includes(reading)) customEntries.readings[ch].push(reading);
    }
  }
  saveStore();
  renderOutput();
}

// teach a brand-new character (not previously in the dictionary at all) permanently
function teachNewChar(ch, reading){
  charMap[ch] = { char: ch, readings: [reading], nghia: '', goiy: '' };
  const key = reading.toLowerCase();
  if (!readingMap[key]) readingMap[key] = [];
  if (!readingMap[key].includes(ch)) readingMap[key].push(ch);
  if (!customEntries.readings[ch]) customEntries.readings[ch] = [];
  if (!customEntries.readings[ch].includes(reading)) customEntries.readings[ch].push(reading);
  charOverrides[ch] = reading;
  saveStore();
}

// ---------- PHIEN AM -> HAN ----------
function parsePhien2Han(text){
  const tokens = text.split(/(\s+)/);
  const seq = [];
  let hanIdx = 0;
  tokens.forEach(tok => {
    if (/^\s+$/.test(tok) || tok === ''){
      seq.push({ type:'text', ch: tok });
    } else {
      seq.push({ type:'syll', tok, idx: hanIdx });
      hanIdx++;
    }
  });
  return seq;
}

function neighborSyll(seq, pos, dir){
  let j = pos + dir;
  while (j >= 0 && j < seq.length){
    if (seq[j].type === 'syll') return seq[j].tok.toLowerCase();
    if (seq[j].type === 'text' && seq[j].ch.includes('\n')) return null;
    j += dir;
  }
  return null;
}

function charFor(idx, tok, seq){
  const key = tok.toLowerCase();
  if (idxOverrides['p'+idx] !== undefined) return idxOverrides['p'+idx];
  const left = neighborSyll(seq, seq.findIndex(s=>s.type==='syll'&&s.idx===idx), -1);
  const right = neighborSyll(seq, seq.findIndex(s=>s.type==='syll'&&s.idx===idx), 1);
  const ctxKeyL = key + '|L:' + left;
  const ctxKeyR = key + '|R:' + right;
  if (left && ctxOverrides[ctxKeyL] !== undefined) return ctxOverrides[ctxKeyL];
  if (right && ctxOverrides[ctxKeyR] !== undefined) return ctxOverrides[ctxKeyR];
  if (charOverrides[key] !== undefined) return charOverrides[key];
  const cands = readingMap[key];
  return cands ? cands[0] : null;
}

function renderPhien2Han(text){
  outputRender.innerHTML = '';
  const seq = parsePhien2Han(text);
  currentParsed = seq;
  seq.forEach(item => {
    if (item.type === 'text'){
      if (item.ch.includes('\n')) outputRender.appendChild(document.createElement('br'));
      else outputRender.appendChild(document.createTextNode(item.ch));
      return;
    }
    const key = item.tok.toLowerCase();
    const cands = readingMap[key];
    const span = document.createElement('span');
    if (!cands){
      span.className = 'unit missing';
      span.textContent = item.tok;
      span.title = 'Chuột phải (hoặc chạm) để thêm chữ Hán cho âm này';
      span.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); showAddCharPhien(span, item.tok); });
      span.addEventListener('click', (e) => { e.stopPropagation(); showAddCharPhien(span, item.tok); });
      span.addEventListener('mouseenter', () => highlightSyll(item.idx));
      span.addEventListener('mouseleave', () => clearInputHighlight());
    } else {
      const chosen = charFor(item.idx, item.tok, seq);
      const rec = charMap[chosen];
      span.className = 'unit' + (cands.length > 1 ? ' ambiguous' : '');
      span.textContent = chosen;
      span.dataset.idx = item.idx;
      span.addEventListener('mouseenter', () => { showInfo(span, chosen, item.tok, rec); highlightSyll(item.idx); });
      span.addEventListener('mouseleave', () => { scheduleClose(); clearInputHighlight(); });
      span.addEventListener('click', (e) => { e.stopPropagation(); showPickerPhien(span, item.idx, item.tok, cands); });
    }
    outputRender.appendChild(span);
  });
}

function showPickerPhien(anchor, idx, tok, cands){
  closeFloating();
  const p = document.createElement('div');
  p.className = 'float-panel picker-panel';

  cands.forEach(c => {

    btn.onclick = (e) => { e.stopPropagation(); showScope(anchor, idx, tok, c, applyPhien2HanChar); };
    p.appendChild(btn);
  });

  const hr = document.createElement('hr'); p.appendChild(hr);
  const row = document.createElement('div'); row.className = 'custom-row';
  const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Chữ Hán khác…';
  const go = document.createElement('button'); go.className='go'; go.title='Dùng âm này'; go.textContent='✓';
  const submit2 = (e) => {
    e.stopPropagation();
    const val = inp.value.trim();
    if (val) showScope(anchor, idx, tok, val, applyPhien2HanChar);
  };
  go.onclick = submit2;
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit2(e); });
  inp.addEventListener('click', e => e.stopPropagation());
  row.appendChild(inp); row.appendChild(go);
  p.appendChild(row);

  attachFloat(anchor, p);
}

function applyPhien2HanChar(scope, idx, tok, chosenChar){
  const key = tok.toLowerCase();
  const seq = currentParsed;
  if (scope === 'single'){
    idxOverrides['p'+idx] = chosenChar;
  } else if (scope === 'context'){
    const pos = seq.findIndex(s=>s.type==='syll'&&s.idx===idx);
    const left = neighborSyll(seq, pos, -1);
    const right = neighborSyll(seq, pos, 1);
    if (left) ctxOverrides[key + '|L:' + left] = chosenChar;
    if (right) ctxOverrides[key + '|R:' + right] = chosenChar;
    if (!left && !right) charOverrides[key] = chosenChar;
  } else {
    charOverrides[key] = chosenChar;
    // teach the dictionary this char permanently for this reading
    if (!readingMap[key]) readingMap[key] = [];
    if (!readingMap[key].includes(chosenChar)){
      readingMap[key].push(chosenChar);
      if (!charMap[chosenChar]) charMap[chosenChar] = { char: chosenChar, readings: [tok], nghia: '(tự thêm)', goiy: '' };
      if (!customEntries.chars[key]) customEntries.chars[key] = [];
      if (!customEntries.chars[key].includes(chosenChar)) customEntries.chars[key].push(chosenChar);
    }
  }
  saveStore();
  renderOutput();
}

// teach a brand-new reading -> character mapping (reading not in dictionary at all)
function teachNewReading(tok, ch){
  const key = tok.toLowerCase();
  if (!readingMap[key]) readingMap[key] = [];
  if (!readingMap[key].includes(ch)) readingMap[key].push(ch);
  if (!charMap[ch]) charMap[ch] = { char: ch, readings: [tok], nghia: '', goiy: '' };
  else if (!charMap[ch].readings.includes(tok)) charMap[ch].readings.push(tok);
  if (!customEntries.chars[key]) customEntries.chars[key] = [];
  if (!customEntries.chars[key].includes(ch)) customEntries.chars[key].push(ch);
  charOverrides[key] = ch;
  saveStore();
}

// right-click on an unrecognized phonetic syllable -> quick "add character" popup
function showAddCharPhien(anchor, tok){
  closeFloating();
  const p = document.createElement('div');
  p.className = 'float-panel picker-panel';
  const title = document.createElement('div');
  title.style.marginBottom = '8px';
  title.textContent = `Thêm chữ Hán cho "${tok}"`;
  p.appendChild(title);
  const row = document.createElement('div'); row.className = 'custom-row';
  const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Dán/gõ chữ Hán…';
  const go = document.createElement('button'); go.className='go'; go.title='Lưu'; go.textContent='✓';
  const submit = (e) => {
    e.stopPropagation();
    const val = inp.value.trim();
    if (val){ teachNewReading(tok, val); closeFloating(); renderOutput(); }
  };
  go.onclick = submit;
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(e); });
  inp.addEventListener('click', e => e.stopPropagation());
  row.appendChild(inp); row.appendChild(go);
  p.appendChild(row);
  attachFloat(anchor, p);
}
function showScope(anchor, idx, key, value, applyFn){
  closeFloating();
  const p = document.createElement('div');
  p.className = 'float-panel picker-panel scope-panel';
  p.innerHTML = `<div class="title">Áp dụng "<b>${value}</b>" cho:</div>`;

  const b1 = document.createElement('button'); b1.textContent = 'Chỉ từ này';
  b1.onclick = (e) => { e.stopPropagation(); applyFn('single', idx, key, value); closeFloating(); };

  const b2 = document.createElement('button'); b2.textContent = 'Cùng cụm từ (ngữ cảnh giống)';
  b2.onclick = (e) => { e.stopPropagation(); applyFn('context', idx, key, value); closeFloating(); };

  const b3 = document.createElement('button'); b3.textContent = 'Toàn bộ văn bản';
  b3.onclick = (e) => { e.stopPropagation(); applyFn('all', idx, key, value); closeFloating(); };

  p.appendChild(b1); p.appendChild(b2); p.appendChild(b3);
  attachFloat(anchor, p);
}

// ---------- render dispatch ----------
function renderOutput(){
  const text = inputArea.value;
  if (mode === 'han2phien') renderHan2Phien(text);
  else renderPhien2Han(text);
}

function extractPlainOutput(){
  if (mode === 'han2phien'){
    let out = '';
    outputRender.childNodes.forEach(node => {
      out += (node.nodeName === 'BR') ? '\n' : node.textContent;
    });
    return out;
  } else {
    const units = outputRender.querySelectorAll('.unit');
    return Array.from(units).map(u => u.textContent).join('');
  }
}

inputArea.addEventListener('input', () => { resetOverrides(); refreshInputHighlight(); buildCharBoxes(); renderOutput(); saveStore(); });

swapBtn.addEventListener('click', () => {
  const newInput = extractPlainOutput();
  mode = mode === 'han2phien' ? 'phien2han' : 'han2phien';
  resetOverrides();
  inputArea.value = newInput.trim();
  refreshInputHighlight();
  buildCharBoxes();
  updateLabels();
  renderOutput();
  saveStore();
});

function updateLabels(){
  if (mode === 'han2phien'){
    leftLabel.textContent = 'Hán cổ';
    rightLabel.textContent = 'Phiên âm Hán Việt';
    inputArea.placeholder = 'Gõ hoặc dán chữ Hán vào đây… ví dụ: 一二三人手心';
  } else {
    leftLabel.textContent = 'Phiên âm Hán Việt';
    rightLabel.textContent = 'Hán cổ';
    inputArea.placeholder = 'Gõ phiên âm, cách nhau bằng dấu cách… ví dụ: nhất nhị tam nhân';
  }
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { inputArea.value = ev.target.result; refreshInputHighlight(); buildCharBoxes(); resetOverrides(); renderOutput(); saveStore(); };
  reader.readAsText(file, 'UTF-8');
});

document.addEventListener('click', (e) => { if (!e.target.closest('.unit')) closeFloating(); });

copyBtn.addEventListener('click', async () => {
  const text = extractPlainOutput();
  try {
    await navigator.clipboard.writeText(text);
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Đã chép ✓';
    setTimeout(() => { copyBtn.textContent = original; }, 1200);
  } catch(e){
    // clipboard API unavailable — fall back to a manual-select trick
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e2){}
    document.body.removeChild(ta);
  }
});

leftFontMinus.addEventListener('click', () => adjustHanFont(-FONT_STEP));
leftFontPlus.addEventListener('click', () => adjustHanFont(FONT_STEP));
rightFontMinus.addEventListener('click', () => adjustPhienFont(-FONT_STEP));
rightFontPlus.addEventListener('click', () => adjustPhienFont(FONT_STEP));

inputArea.value = (stored && stored.lastText) || '一二三人手心大小山水行';
applyFontSizes();
refreshInputHighlight();
buildCharBoxes();
updateLabels();
renderOutput();
pullFromCloud();
</script>
